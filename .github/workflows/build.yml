name: Build Flock-Detector IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Initialize Swift Package Build Wrapper
        run: |
          if [ ! -f "Package.swift" ]; then
            cat << 'EOF' > Package.swift
            // swift-tools-version: 5.9
            import PackageDescription
            let package = Package(
                name: "FlockDetector",
                platforms: [.iOS(.v16)],
                products: [
                    .library(name: "FlockDetector", targets: ["FlockDetector"])
                ],
                targets: [
                    .target(
                        name: "FlockDetector",
                        path: "."
                    )
                ]
            )
            EOF
          fi

      - name: Build and Package Unsigned App
        run: |
          set -e
          mkdir -p build/Payload/FlockDetector.app
          
          # Compile the package target for iOS
          swift build -c release --triple arm64-apple-ios-simulator
          
          # Move binary into the .app container
          if [ -f ".build/arm64-apple-ios/release/FlockDetector" ]; then
            cp .build/arm64-apple-ios/release/FlockDetector build/Payload/FlockDetector.app/FlockDetector
          elif [ -f ".build/release/FlockDetector" ]; then
            cp .build/release/FlockDetector build/Payload/FlockDetector.app/FlockDetector
          fi
          
          # Generate Info.plist manifest
          cat << 'EOF' > build/Payload/FlockDetector.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.lbl215.flockdetector</string>
              <key>CFBundleName</key>
              <string>FlockDetector</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          cd build
          zip -r -y "unsigned.ipa" Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/unsigned.ipa
