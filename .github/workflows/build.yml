name: Build Flock-Detector IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select latest Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate and Build Project
        run: |
          set -e
          
          # Generate Xcode project from project.yml configuration
          if [ -f "project.yml" ]; then
            xcodegen generate
          fi
          
          # Detect project filename and scheme dynamically
          PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          echo "Using project: $PROJECT_FILE with scheme: $SCHEME_NAME"
          
          # Create a custom entitlements file to ensure clean on-device signing compatibility
          cat << 'EOF' > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          dict>
              <key>keychain-access-groups</key>
              <array>
                  <string>$(AppIdentifierPrefix)com.lbl215.flockdetector</string>
              </array>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Build using xcodebuild for generic iOS device architecture with proper packaging flags
          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="Apple Development" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Products"
            
          # Package into the IPA payload structure
          mkdir -p build/Payload
          cp -R build/Products/*.app build/Payload/
          cd build
          zip -r -y "unsigned.ipa" Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/unsigned.ipa
