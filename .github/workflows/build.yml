name: Build Flock-Detector IPA

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'

    - name: Compile and Archive
      run: |
        # Create output directories
        mkdir -p Payload
        
        # Compile raw SwiftUI files into an executable bundle structure
        swiftc -parse-as-library \
          FlockDetectorApp.swift ContentView.swift \
          -o Payload/FlockDetector \
          -target arm64-apple-ios16.0-simulator \
          -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
          -framework SwiftUI -framework CoreLocation -framework MapKit
          
        # Package the output into a downloadable archive
        cd Payload
        zip -r ../FlockDetector.zip FlockDetector
        cd ..
        echo "Build sequence finished successfully."

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlockDetector-Artifact
        path: FlockDetector.zip
